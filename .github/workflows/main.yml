name: Render Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libgbm1 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libasound2t64
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Render video (software WebGL)
        env:
          GL: swiftshader
        run: node render.mjs video out.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cow-milking-video
          path: out.mp4
          retention-days: 7
